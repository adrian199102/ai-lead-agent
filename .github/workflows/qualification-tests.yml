name: Node qualification tests
on:
  pull_request:
  push:
    branches: [feature/secure-lead-qualification, main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Mandatory dependency security audit
        run: npm audit --audit-level=high
      - run: npm test
        env:
          NODE_ENV: test
